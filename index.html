<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#12263a;--sub:#4b6275;--blue:#2f5f9a;--tink:#fff;--ok:#1e7a52;--okbg:#dff3e8;--bad:#b3402f;--badbg:#fbe5e0;--line:#c9d6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1b26;--card:#16283a;--ink:#e7f0f5;--sub:#9db4c4;--blue:#7fb0ee;--tink:#08202b;--ok:#6fd1a0;--okbg:#14382a;--bad:#f09a8a;--badbg:#44211b;--line:#2b4357}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.45}
main{max-width:600px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.3rem;margin:0 0 2px}.sub{color:var(--sub);font-size:.9rem;margin:0 0 12px}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{font-size:.85rem;padding:8px 12px;border-radius:20px;border:2px solid var(--line);background:var(--card);max-width:100%}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 10px}.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.cnt{text-align:center;color:var(--sub);font-size:.9rem;margin:6px 0 10px}
.q{font-size:1.1rem;margin:0 0 6px}.sentq{font-size:1.25rem;margin:10px 0 8px;line-height:1.6}
.hint{color:var(--sub);font-size:.9rem;margin:0 0 14px}.tagl{display:block;font-size:.8rem}
.gap{display:inline-block;min-width:1.6em;border-bottom:3px solid var(--blue);text-align:center;color:transparent}
mark{background:none;color:var(--blue);font-weight:700;border-bottom:3px solid var(--blue)}
.ends{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 12px}
.opt{padding:14px 0;font-size:1.1rem;font-weight:700;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:10px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt:disabled{cursor:default}
.fb{padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin:4px 0 14px;font-size:.95rem}
.fb b.ok{color:var(--ok)}.fb b.bad{color:var(--bad)}.why{margin-top:8px}.why p{margin:6px 0}
.go{font-weight:700;padding:13px 10px;border:2px solid var(--blue);border-radius:10px;background:var(--blue);color:var(--tink)}
.score{font-size:2.8rem;font-weight:700;margin:8px 0 2px}.err{color:var(--bad);font-weight:700}
.empty{text-align:center;color:var(--sub);padding:34px 0}
details.cheat{margin-top:20px;border-top:1px solid var(--line);padding-top:10px;font-size:.9rem}
details.cheat table{border-collapse:collapse;margin:8px 0;width:100%}details.cheat caption{text-align:left;font-weight:700;padding:4px 0}
details.cheat th,details.cheat td{border:1px solid var(--line);padding:4px 6px;text-align:center}
details.fe{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 8px;font-size:.95rem}details.fe summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

var KL={def:"bestimmter Artikel",indef:"unbestimmter Artikel",poss:"Possessivartikel","null":"ohne Artikel"};
var TAB={
 weak:[{m:"e",f:"e",n:"e",p:"en"},{m:"en",f:"e",n:"e",p:"en"},{m:"en",f:"en",n:"en",p:"en"},{m:"en",f:"en",n:"en",p:"en"}],
 mixed:[{m:"er",f:"e",n:"es",p:"en"},{m:"en",f:"e",n:"es",p:"en"},{m:"en",f:"en",n:"en",p:"en"},{m:"en",f:"en",n:"en",p:"en"}],
 strong:[{m:"er",f:"e",n:"es",p:"e"},{m:"en",f:"e",n:"es",p:"e"},{m:"em",f:"er",n:"em",p:"en"},{m:"en",f:"er",n:"en",p:"er"}]};
var DEF={der:{m:["der","den","dem","des"],f:["die","die","der","der"],n:["das","das","dem","des"],p:["die","die","den","der"]},
 dies:{m:["dieser","diesen","diesem","dieses"],f:["diese","diese","dieser","dieser"],n:["dieses","dieses","diesem","dieses"],p:["diese","diese","diesen","dieser"]}};
var EIN={ein:{m:["ein","einen","einem","eines"],f:["eine","eine","einer","einer"],n:["ein","ein","einem","eines"]},
 kein:{m:["kein","keinen","keinem","keines"],f:["keine","keine","keiner","keiner"],n:["kein","kein","keinem","keines"],p:["keine","keine","keinen","keiner"]}};
var POSS={m:["","en","em","es"],f:["e","e","er","er"],n:["","","em","es"],p:["e","e","en","er"]};
var ENDS=["e","en","er","em","es"];
var app=document.getElementById("app"),st={art:"alle",cas:"alle"},Q=[],qi=0,score=0,picked=null,errs=[];
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function up(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function match(f,n){return f.g.indexOf(n.grp)>=0||f.g.indexOf(n.l)>=0}
function fits(a,n){return a.fit.indexOf(n.grp)>=0||a.fit.indexOf(n.l)>=0}
function artf(art,g,cs){
 if(art==="der")return DEF.der[g][cs];if(art==="dieser")return DEF.dies[g][cs];
 if(art==="ein")return EIN.ein[g][cs];if(art==="kein")return EIN.kein[g][cs];
 return art+POSS[g][cs]}
var KEINT=["Das ¦ist|sind¦","Ich suche","Ich kenne","Sie hat","Wir haben {NP} lange","Er hat","Wegen","Trotz","Hier ¦wird"];
function keinOk(f){return KEINT.some(function(x){return f.t.indexOf(x)===0})}
function gen(kf){
 var cc=st.cas==="alle"?Math.floor(Math.random()*4):+st.cas,fr=FR.filter(function(f){return f.c===cc});if(!fr.length)return null;
 var f=pick(fr),ns=NO.filter(function(n){return match(f,n)});if(!ns.length)return null;
 var n=pick(ns),kind=kf||(st.art==="alle"?pick(["def","indef","poss","null"]):st.art),num,art="",type;
 if(kind==="null"){num=n.mass?"sg":"pl";type="strong"}
 else{num=n.mass?"sg":(Math.random()<0.7?"sg":"pl");
  if(kind==="def"){type="weak";art=pick(["der","dieser"])}
  else if(kind==="indef"){type="mixed";if(n.mass)return null;art=num==="pl"?"kein":pick(["ein","kein"]);if(art==="kein"&&!keinOk(f)){if(num==="pl")return null;art="ein"}}
  else{type="mixed";art=pick(["mein","dein","sein","ihr","unser"])}}
 var as=AD.filter(function(a){return fits(a,n)});if(!as.length)return null;
 var a=pick(as),g=num==="pl"?"p":n.g,cs=f.c;
 var form=num==="pl"?(cs===2?n.p[1]:cs===3?n.p[2]:n.p[0]):n.s[cs];
 return {f:f,n:n,a:a,kind:kind,art:art,af:art?artf(art,g,cs):"",num:num,g:g,cs:cs,form:form,type:type,end:TAB[type][cs][g]}}
function build(n){
 var out=[],seen={},cyc=["def","indef","poss","null"],t=0,i=0;
 while(out.length<n&&t<8000){t++;var kf=st.art==="alle"?cyc[out.length%4]:st.art,q=gen(kf);if(!q)continue;var k=q.f.t+q.n.l+q.a.a+q.kind+q.af+q.num;if(seen[k])continue;seen[k]=1;out.push(q)}
 return out.sort(function(){return Math.random()-.5})}
function np(q,mode,ch){
 var art=q.af,stem=q.a.a,gp=mode==="gap"?'<span class="gap">__</span>':'<mark>'+(ch||q.end)+'</mark>';
 return art+(art?" ":"")+stem+gp+" "+q.form}
function nsent(q,mode,ch){
 var t=q.f.t.replace(/¦(.+?)\|(.+?)¦/g,function(m,a,b){return q.num==="pl"?b:a});
 var inner=q.af?q.af:q.a.a;
 var np1=np(q,mode,ch);
 if(t.indexOf("{NP}")===0){np1=q.af?up(q.af)+np1.slice(q.af.length):up(np1)}
 return esc(t).replace("{NP}","\u0001").replace("\u0001",np1)}
function combos(type,end){
 var r=[];for(var c=0;c<4;c++)["m","f","n","p"].forEach(function(g){if(TAB[type][c][g]===end)r.push(CASES[c]+" "+GN[g])});return r}
function noEnding(q){return q.type==="mixed"&&((q.cs===0&&q.g==="m")||((q.cs===0||q.cs===1)&&q.g==="n"))}
function artText(q){
 if(q.kind==="def")return "Der bestimmte Artikel „"+q.af+"“ zeigt Kasus, Genus und Numerus schon selbst. Darum hat das Adjektiv nur die schwache Endung -e oder -en: -e im Nominativ Singular sowie im Akkusativ Femininum und Neutrum, sonst -en.";
 if(q.kind==="null")return "Es gibt keinen Artikel. Dann trägt das Adjektiv die Endung des bestimmten Artikels (der → -er, die → -e, das → -es, den → -en, dem → -em, der → -er). Sonderfall: Im Genitiv Maskulinum und Neutrum steht -en, weil das Nomen schon -s hat.";
 var nm=q.kind==="poss"?"Der Possessivartikel „"+q.af+"“ wird wie „ein/kein“ dekliniert. ":"Der Artikel „"+q.af+"“ ";
 if(noEnding(q))return nm+(q.kind==="poss"?"Hier hat er":"hat hier")+" keine Endung. Deshalb muss das Adjektiv Genus und Kasus zeigen: -er (Maskulinum Nominativ), -es (Neutrum Nominativ und Akkusativ).";
 return nm+(q.kind==="poss"?"Hier zeigt er":"zeigt hier")+" Kasus und Genus schon durch seine Endung. Darum genügt beim Adjektiv -e oder -en.";}
function nounText(q){return "„"+q.form+"“ ist "+(q.num==="pl"?"Plural":GN[q.n.g]+" (Singular)")+"."}
function short(q){return CASES[q.cs]+" "+(q.num==="pl"?"Plural":GN[q.n.g])+", "+KL[q.kind]+" → -"+q.end}
function explain(q,ch){
 var h='<p><b>1. Kasus:</b> '+esc(q.f.r)+' → <b>'+CASES[q.cs]+'</b>.</p><p><b>2. Nomen:</b> '+esc(nounText(q))+'</p><p><b>3. Artikel:</b> '+esc(artText(q))+'</p><p><b>4. Ergebnis:</b> '+esc(short(q))+'.</p>';
 if(ch&&ch!==q.end){var c=combos(q.type,ch);h+='<p><b>Deine Wahl -'+ch+':</b> '+(c.length?"Diese Endung passt bei dieser Artikelart zu: "+esc(c.slice(0,4).join(", "))+".":"Diese Endung gibt es bei dieser Artikelart nicht.")+'</p>'}
 return h}
function newRound(){Q=build(20);qi=0;score=0;picked=null;errs=[]}
function head(){
 return '<h1>Adjektivdeklination</h1><p class="sub">B2 · alles gemischt · mit Adjektiven aus deinen Wortlisten</p>'}
function wire(){
 var sa=document.getElementById("sa");if(sa)sa.onchange=function(){st.art=this.value;newRound();render()};
 var sc=document.getElementById("sc");if(sc)sc.onchange=function(){st.cas=this.value;newRound();render()}}
function cheat(){
 function tb(t,title){var h='<table><caption>'+title+'</caption><tr><th></th><th>m</th><th>f</th><th>n</th><th>Pl</th></tr>';
  for(var c=0;c<4;c++)h+='<tr><th>'+CASES[c].slice(0,3)+'.</th><td>-'+TAB[t][c].m+'</td><td>-'+TAB[t][c].f+'</td><td>-'+TAB[t][c].n+'</td><td>-'+TAB[t][c].p+'</td></tr>';return h+'</table>'}
 return '<details class="cheat"><summary>Tabellen zum Nachschlagen</summary>'+tb("weak","Nach bestimmtem Artikel (der, dieser)")+tb("mixed","Nach ein, kein und Possessivartikeln")+tb("strong","Ohne Artikel")+'</details>'}
function quiz(){
 var h=head();
 if(!Q.length){app.innerHTML=h+'<p class="empty">Für diese Auswahl gibt es keine Fragen.</p>'+cheat();wire();return}
 if(qi>=Q.length){
  var by={},bc={};errs.forEach(function(e){by[KL[e.q.kind]]=(by[KL[e.q.kind]]||0)+1;bc[CASES[e.q.cs]]=(bc[CASES[e.q.cs]]||0)+1});
  function tally(o){var k=Object.keys(o);return k.length?k.map(function(x){return esc(x)+": "+o[x]}).join(" · "):"–"}
  h+='<p class="q">Ergebnis</p><div class="score">'+score+" / "+Q.length+'</div><p class="q">Fehler: <span class="err">'+errs.length+'</span> von '+Q.length+'</p><p class="hint">'+(errs.length===0?"Alles richtig!":errs.length<=Q.length*0.2?"Sehr gut.":errs.length<=Q.length*0.4?"Gut, aber übe die Fehler noch einmal.":"Das lohnt sich zu wiederholen. Schau dir die Tabellen und die Erklärungen an.")+'</p>';
  if(errs.length){h+='<p class="hint"><b>Fehler nach Artikelart:</b> '+tally(by)+'<br><b>Fehler nach Kasus:</b> '+tally(bc)+'</p><p class="q">Deine Fehler mit Erklärung:</p>';
   errs.forEach(function(e){h+='<details class="fe"><summary>'+nsent(e.q,"fill")+'</summary><p>Du hast <b>-'+e.ch+'</b> gewählt, richtig ist <b>-'+e.q.end+'</b>.</p>'+explain(e.q,e.ch)+'</details>'})}
  h+='<button class="go fill" id="again" style="width:100%;margin-top:14px">Neue Runde</button>'+cheat();
  app.innerHTML=h;wire();document.getElementById("again").onclick=function(){newRound();quiz()};return}
 var q=Q[qi];
 h+='<div class="bar"><i style="width:'+(qi/Q.length*100)+'%"></i></div><p class="cnt">Frage '+(qi+1)+" von "+Q.length+' · Fehler: <span class="err">'+errs.length+'</span></p>'+
 '<p class="q sentq">'+nsent(q,"gap")+'</p><p class="hint">Welche Endung hat „'+esc(q.a.a)+'“? <span class="tagl">Wort aus deiner Liste: Lektion '+q.a.L+'</span></p><div class="ends">';
 ENDS.forEach(function(e){var c="opt";if(picked!==null){if(e===q.end)c+=" ok";else if(e===picked)c+=" bad"}h+='<button class="'+c+'" data-e="'+e+'"'+(picked!==null?" disabled":"")+">-"+e+"</button>"});
 h+="</div>";
 if(picked!==null){var ok=picked===q.end;
  h+='<div class="fb"><b class="'+(ok?"ok":"bad")+'">'+(ok?"Richtig.":"Falsch.")+"</b> "+(ok?"":"Richtig ist -"+q.end+" (du hast -"+picked+" gewählt). ")+'<br>'+nsent(q,"fill")+'<div class="why">'+(ok?'<p>'+esc(short(q))+'.</p><details><summary>Warum?</summary>'+explain(q)+'</details>':explain(q,picked))+'</div></div><button class="go fill" id="nq" style="width:100%">'+(qi===Q.length-1?"Ergebnis anzeigen":"Nächste Frage")+"</button>"}
 app.innerHTML=h+cheat();wire();
 app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){picked=b.dataset.e;if(picked===q.end)score++;else errs.push({q:q,ch:picked});quiz()}});
 var nq=document.getElementById("nq");if(nq)nq.onclick=function(){picked=null;qi++;quiz();window.scrollTo(0,0)}}

newRound();render();
